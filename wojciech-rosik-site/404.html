<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Wojciech Rosik</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F3EE;color:#16181B;font-family:Georgia,serif;text-align:center;padding:24px}
  h1{font-weight:400;font-size:44px;margin:0 0 12px}
  p{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#646870;margin:0 0 24px}
  a{display:inline-block;padding:12px 22px;border-radius:999px;background:#16181B;color:#fff;text-decoration:none;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Nie znaleziono strony · Page not found</p>
  <a id="home" href="./">Wróć na stronę główną · Go home</a>
</main>
<script>
  // Działa także w podkatalogu repozytorium na GitHub Pages: /<repo>/...
  (function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var base = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
    document.getElementById("home").href = base;
  })();
</script>
</body>
</html>
